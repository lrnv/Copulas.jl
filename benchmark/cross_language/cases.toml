[suite]
schema_version = 1
seed = 23
full_repetitions = 20
smoke_repetitions = 3
validation_points = 20

[[cases]]
name = "sampling/clayton_d5"
operation = "sample"
family = "clayton"
dimension = 5
parameter = 2.0
n = 10000
smoke_n = 500

[[cases]]
name = "sampling/gumbel_d5"
operation = "sample"
family = "gumbel"
dimension = 5
parameter = 2.0
n = 10000
smoke_n = 500

[[cases]]
name = "sampling/gaussian_d10"
operation = "sample"
family = "gaussian"
dimension = 10
parameter = 0.35
n = 10000
smoke_n = 500

[[cases]]
name = "density/gumbel_d5"
operation = "logdensity"
family = "gumbel"
dimension = 5
parameter = 2.0
n = 10000
smoke_n = 250
input = "data/uniform_points.csv"
validation_atol = 1.0e-8
validation_rtol = 1.0e-8

[[cases]]
name = "density/gaussian_d10"
operation = "logdensity"
family = "gaussian"
dimension = 10
parameter = 0.35
n = 10000
smoke_n = 250
input = "data/uniform_points.csv"
validation_atol = 1.0e-8
validation_rtol = 1.0e-8

[[cases]]
name = "data/pseudos_5x10000"
operation = "pseudos"
dimension = 5
n = 10000
smoke_n = 250
input = "data/raw_data.csv"
validation_atol = 1.0e-12
validation_rtol = 1.0e-12

[[cases]]
name = "fitting/gumbel_itau"
operation = "fit_itau"
family = "gumbel"
dimension = 2
n = 2000
smoke_n = 250
input = "data/gumbel_fit.csv"
validation_atol = 1.0e-8
validation_rtol = 1.0e-8

[[cases]]
name = "fitting/gaussian_mle"
operation = "fit_mle"
family = "gaussian"
dimension = 3
n = 1000
smoke_n = 250
input = "data/gaussian_fit.csv"
# Copulas.jl uses a closed-form latent-normal correlation estimate while R's
# copula package numerically optimizes the copula likelihood. The smoke sample
# has only 250 observations, so the equivalent estimators are not bit-identical.
validation_atol = 2.0e-2
validation_rtol = 2.0e-2
