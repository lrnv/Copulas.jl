# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Documenter

on:
  # Runs on pushes targeting the `main` branch. Change this to `main` if you're
  # using the `main` branch as the default branch.
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cross-language-benchmarks:
    name: Julia vs R (${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROSS_BENCH_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      CROSS_BENCH_ROUNDS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@v3
      - name: Instantiate Julia benchmark environment
        run: julia --startup-file=no --project=benchmark/cross_language/julia -e 'using Pkg; Pkg.instantiate()'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install R system requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: benchmark/cross_language/r

      - name: Run interleaved Julia and R benchmarks
        run: bash benchmark/cross_language/scripts/run_suite.sh

      - name: Add comparison to job summary
        if: always() && hashFiles('benchmark/cross_language/results/comparison.md') != ''
        run: cat benchmark/cross_language/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results for the documentation build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-vs-r-documentation
          path: |
            benchmark/cross_language/results/raw/
            benchmark/cross_language/results/comparison.json
            benchmark/cross_language/results/comparison.md
          if-no-files-found: error
          retention-days: 90

  # Build job
  build:
    needs: [cross-language-benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      - name: Download this build's Julia versus R results
        uses: actions/download-artifact@v4
        with:
          name: julia-vs-r-documentation
          path: ${{ runner.temp }}/julia-vs-r-documentation
      - name: Embed this build's results in the documentation
        run: >-
          julia --startup-file=no benchmark/cross_language/scripts/inject_docs.jl
          "${{ runner.temp }}/julia-vs-r-documentation/comparison.md"
          docs/src/manual/benchmarks.md
      - name: Build and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          GKSwstype: "100" # for Plots.jl plots (if you have them)
          JULIA_DEBUG: "Documenter"
          DATADEPS_ALWAYS_ACCEPT: true
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v6
        with: 
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
