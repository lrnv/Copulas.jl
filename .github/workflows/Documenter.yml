# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Documenter

on:
  # Runs on pushes targeting the `main` branch. Change this to `main` if you're
  # using the `main` branch as the default branch.
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      benchmarks:
        description: 'Regenerate the Julia/R comparison embedded in the documentation'
        required: false
        default: false
        type: boolean

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Setup R
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmarks }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install R copula package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmarks }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev
          Rscript -e 'install.packages("copula")'
      - name: Build and deploy docs
        run: julia -O0 --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          GKSwstype: "100" # for Plots.jl plots (if you have them)
          DATADEPS_ALWAYS_ACCEPT: true
          COPULAS_DOCS_BENCHMARKS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmarks }}
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v6
        with: 
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
