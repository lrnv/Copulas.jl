name: Temporary model display fix

on:
  push:
    branches: [parameter-spaces-fitting]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Patch display
        run: |
          sed -i 's/if _has(:ρ);/if _specialized(:ρ);/' src/show.jl
          sed -i 's/if _has(:β);/if _specialized(:β);/' src/show.jl
          sed -i 's/if _has(:λᵤ);/if _specialized(:λᵤ);/' src/show.jl
          sed -i 's/if _has(:λₗ);/if _specialized(:λₗ);/' src/show.jl
          git diff --check
      - name: Verify display
        run: |
          timeout 60s julia --project --startup-file=no -e 'using Pkg; Pkg.instantiate(); using Copulas, StatsBase, Distributions; G=GaussianCopula([1.0 0.4 0.2;0.4 1.0 0.3;0.2 0.3 1.0]); M=CopulaModel(G,zeros(3,1),0.0,Copulas._CopulaFitSpec(GaussianCopula,:mle,(;))); report=sprint(show,M); @assert occursin("Σ:",report); println(report)'
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-diagnose-tests.yml
          git add src/show.jl
          git commit -m "Keep model display free of numerical integration"
          git push
