name: CI
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/CI.yml'
  push:
    tags:
      - '*'
    branches:
      - main
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/CI.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          COPULAS_TEST_TIMINGS: ${{ github.workspace }}/test-timings.toml
        with:
          force_latest_compatible_version: ${{ matrix.version == '1.11' && 'false' || 'auto' }}
          coverage: ${{ matrix.version == '1.11' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-timings-julia-${{ matrix.version }}
          path: test-timings.toml
          if-no-files-found: warn
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.11'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1.11'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
