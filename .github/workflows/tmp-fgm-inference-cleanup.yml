name: Temporary FGM Paramorph inference cleanup

on:
  push:
    branches:
      - parameter-spaces-fitting
    paths:
      - .github/workflows/tmp-fgm-inference-cleanup.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Patch FGM parameter contract and inference
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Check patch
        run: git diff --check
      - name: Verify FGM analytical inference
        run: |
          julia --project --startup-file=no -e 'using Pkg; Pkg.instantiate(); using Copulas, Distributions, StatsBase, Random; C=FGMCopula(2,0.4); @assert params(C)==(0.4,); p=Copulas.Paramorph.param_space(C); @assert Copulas.Paramorph.unconstrain(p,params(C)) isa Vector; U=rand(MersenneTwister(554),C,250); M=fit(CopulaModel,FGMCopula,U;method=:mle); I=infer(M); @assert I.method===:hessian; @assert size(vcov(I))==(1,1); @assert all(isfinite,vcov(I)); R=fit(CopulaModel,FGMCopula,U;method=:itau); G=infer(R;rng=MersenneTwister(555),nresamples=20); @assert G.method===:godambe; @assert size(vcov(G))==(1,1)'
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fgm-inference-cleanup.yml
          git add src/MiscellaneousCopulas/FGMCopula.jl src/Inference.jl test/operations/fitting.jl
          git diff --check
          git commit -m "Complete bivariate FGM Paramorph integration"
          git push
