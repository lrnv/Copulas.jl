name: Paramorph 0.0.3 migration

on:
  push:
    branches:
      - paramorph-0.0.3-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-migration
      - name: Apply source migration
        run: python dev/migrate_paramorph_003.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Project.toml docs/Project.toml src
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "Migrate declarations to Paramorph 0.0.3 DSL"
            git push origin HEAD:paramorph-0.0.3-migration
          fi
