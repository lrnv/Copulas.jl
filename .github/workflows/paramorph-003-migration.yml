name: Paramorph 0.0.3 integration

on:
  push:
    branches:
      - paramorph-0.0.3-migration

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
      - name: Reject legacy Paramorph protocol extensions
        run: |
          if grep -R -nE '^(function )?Paramorph\.(schema_|transformation_schema|parameter_values|reconstruct_struct|parameter_fields_override|schema_override)' src; then
            echo 'Legacy Paramorph protocol extensions remain' >&2
            exit 1
          fi
          if grep -n 'Paramorph\.' src/Fitting.jl src/Inference.jl src/NaturalParameters.jl src/ParameterCoefficients.jl; then
            echo 'Runtime Paramorph leaked outside the centralized bridge' >&2
            exit 1
          fi
      - name: Strict precompile
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.precompile(; strict=true)
      - name: Conditioning-only diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/runtests.jl")
          text = path.read_text()
          text = text.replace("\n_probe_conditioning_routes()\n", "\n")
          start = text.index("testfiles = (")
          marker = '\n\n@testset verbose=true "Copulas.jl" begin'
          end = text.index(marker, start)
          text = (
              text[:start]
              + 'testfiles = ("api/copulas.jl", "operations/conditioning.jl")'
              + text[end:]
          )
          path.write_text(text)
          PY

          # A healthy conditioning suite takes only a few tens of seconds.
          # Interrupt a real regression after enough headroom for Pkg.test's
          # temporary test environment so Julia prints the active stack.
          timeout --signal=INT --kill-after=10s 120s \
            julia --project=. --color=yes -e 'using Pkg; Pkg.test()'
