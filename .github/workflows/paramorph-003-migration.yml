name: Apply Paramorph bridge refactor

on:
  push:
    branches:
      - paramorph-0.0.3-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-migration
      - name: Apply bridge refactor
        run: python dev/refactor_paramorph_bridge.py
      - name: Commit bridge refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo "No refactor changes"
          else
            git commit -m "Centralize Paramorph runtime geometry bridge"
            git push origin HEAD:paramorph-0.0.3-migration
          fi
