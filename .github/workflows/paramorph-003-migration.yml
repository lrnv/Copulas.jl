name: Paramorph 0.0.3 integration

on:
  push:
    branches:
      - paramorph-0.0.3-migration

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
      - name: Reject legacy Paramorph protocol extensions
        run: |
          if grep -R -nE '^(function )?Paramorph\.(schema_|transformation_schema|parameter_values|reconstruct_struct|parameter_fields_override|schema_override)' src; then
            echo 'Legacy Paramorph protocol extensions remain' >&2
            exit 1
          fi
          if grep -n 'Paramorph\.' src/Fitting.jl src/Inference.jl src/NaturalParameters.jl src/ParameterCoefficients.jl; then
            echo 'Runtime Paramorph leaked outside the centralized bridge' >&2
            exit 1
          fi
      - name: Strict precompile
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.precompile(; strict=true)
      - name: Huesler-Reiss conditioning probe
        shell: bash
        run: |
          timeout --signal=INT --kill-after=5s 30s julia --project=. --color=yes -e '
            using Copulas, Distributions
            C = HuslerReissCopula{3}(1.0)
            println("constructed C")
            @time H = condition(C, 1, 0.4)
            println("conditioned: ", typeof(H))
            println("margin 1 cdf")
            @time v1 = cdf(H.m[1], 0.5)
            println("margin 1 cdf done: ", v1)
            println("margin 2 cdf")
            @time v2 = cdf(H.m[2], 0.5)
            println("margin 2 cdf done: ", v2)
            println("margin 1 quantile")
            @time q1 = quantile(H.m[1], v1)
            println("margin 1 quantile done: ", q1)
            println("margin 2 quantile")
            @time q2 = quantile(H.m[2], v2)
            println("margin 2 quantile done: ", q2)
            println("conditional copula cdf")
            @time cv = cdf(H.C, [v1, v2])
            println("conditional copula cdf done: ", cv)
            println("full conditional cdf")
            @time hv = cdf(H, [0.5, 0.5])
            println("full conditional cdf done: ", hv)
          '
