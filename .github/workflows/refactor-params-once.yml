name: Refactor distribution params once

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 0
      - name: Apply params refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor_distribution_params.py')
          s = p.read_text()
          old = '''for folder in ('src/Generator', 'src/Tail'):
              for path in Path(folder).glob('*.jl'):
                  if 'Distributions.params(' in read(path):
                      raise RuntimeError(f'non-Distribution params method remains in {path}')
          '''
          new = '''for folder in ('src/Generator', 'src/Tail'):
              for path in Path(folder).glob('*.jl'):
                  source = read(path)
                  bad = re.search(r'Distributions\\.params\\([^\\n]*(?:Generator|Tail)[^\\n]*\\)', source)
                  if bad:
                      raise RuntimeError(f'non-Distribution params method remains in {path}: {bad.group(0)}')
          '''
          if old not in s:
              raise RuntimeError('audit patch anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python scripts/refactor_distribution_params.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ext test docs
          git commit -m 'Align params with Distributions and Paramorph'
          git push origin HEAD:parameter-spaces-fitting
