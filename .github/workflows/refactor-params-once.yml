name: Refactor distribution params once

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 0
      - name: Apply params refactor
        run: |
          python scripts/refactor_distribution_params.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ext test docs
          git commit -m 'Align params with Distributions and Paramorph'
          git push origin HEAD:parameter-spaces-fitting
