name: Finalize Paramorph cleanup

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 0

      - name: Finish Paramorph migration
        run: |
          python scripts/finalize_paramorph_cleanup.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Paramorph migration cleanup'
          git push origin HEAD:parameter-spaces-fitting
