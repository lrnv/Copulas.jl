name: Finalize Paramorph cleanup

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 1

      - name: Finish Paramorph migration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/finalize_paramorph_cleanup.py')
          text = p.read_text()

          old_anchor = '''replace(
              "src/Fitting.jl",
              "Simple parametric families opt into the generic routines by defining `Paramorph.param_space`\\n#####  and `Paramorph.param_space`.",
              "Simple parametric families opt into the generic routines by defining `Paramorph.param_space`\\n#####  and a canonical `CT(d, parameters...)` constructor.",
          )'''
          new_anchor = '''replace(
              "src/Fitting.jl",
              "and `Paramorph.param_space`.",
              "and a canonical `CT(d, parameters...)` constructor.",
          )'''
          if old_anchor not in text:
              raise RuntimeError('cleanup-script Fitting anchor not found')
          text = text.replace(old_anchor, new_anchor, 1)

          docs_marker = '''# ---------------------------------------------------------------------------
          # Documentation: tuple-valued Distribution params and Paramorph fitting API.
          # ---------------------------------------------------------------------------'''
          remove_marker = '''# Remove migration-only scripts. This script removes itself after running; the
          # workflow is deleted separately by a user-attributed commit so final CI runs.'''
          docs_start = text.index(docs_marker)
          remove_start = text.index(remove_marker)
          text = text[:docs_start] + text[remove_start:]
          text = text.replace(
              'for root in (Path("src"), Path("test"), Path("docs")):',
              'for root in (Path("src"), Path("test")):',
          )
          p.write_text(text)
          PY

          python scripts/finalize_paramorph_cleanup.py

          # Apply only byte-local documentation changes. This deliberately does
          # not decode/rewrite whole Markdown files because several pre-existing
          # docs contain mixed LF/CRLF line endings.
          python - <<'PY'
          from pathlib import Path
          import re

          def replaceb(path, old, new, count=1):
              p = Path(path)
              raw = p.read_bytes()
              oldb = old.encode('utf-8')
              newb = new.encode('utf-8')
              actual = raw.count(oldb)
              if actual < count:
                  raise RuntimeError(f'missing docs anchor in {path}: {old!r} (found {actual})')
              p.write_bytes(raw.replace(oldb, newb, count))

          def subblock(path, pattern, replacement, count=1):
              p = Path(path)
              raw = p.read_bytes()
              rx = re.compile(pattern.encode('utf-8'), re.S)
              matches = list(rx.finditer(raw))
              if len(matches) != count:
                  raise RuntimeError(f'expected {count} docs block(s) in {path}, found {len(matches)}')
              # Replace from the end so byte offsets remain stable.
              for m in reversed(matches):
                  nl = b'\r\n' if b'\r\n' in m.group(0) else b'\n'
                  repl = replacement.encode('utf-8').replace(b'\n', nl)
                  raw = raw[:m.start()] + repl + raw[m.end():]
              p.write_bytes(raw)

          guide = 'docs/src/dev/developer_guide.md'
          replaceb(guide, 'three-method [`Generator`](@ref) protocol', 'two-method [`Generator`](@ref) protocol')
          replaceb(guide, 'implement its three-method mathematical contract:', 'implement its two-method mathematical contract:')
          replaceb(
              guide,
              'Paramorph.param_space(::Type{<:MardiaCopula}, d) = Paramorph.Id(:θ)',
              'Paramorph.param_space(::Type{<:MardiaCopula}, d) = Paramorph.Bounded(:θ, -1.0, 1.0)',
          )

          subblock(
              guide,
              r'''### Opting into generic fitting methods\r?\n\r?\n.*?\r?\nEach fitting method is dispatched on `Val\{:method\}` for performance and clarity\.''',
              '''### Opting into generic fitting methods

Simple parametric families opt into the generic transformed-space MLE by
defining their parameter geometry with `Paramorph.param_space` and supporting
the canonical `CT(d, parameters...)` constructor. `Distributions.params(C)`
remains the positional constructor tuple; logical names and constraints belong
to the Paramorph space.

| Definition | Purpose |
| ---------- | ------- |
| `Paramorph.param_space(CT, d)` | Describe logical parameter names, constraints, and optimizer dimension |
| `CT(d, parameters...)` | Reconstruct a copula from constrained logical parameters |
| `_available_fitting_methods(CT, d)` | Register the in-package estimators exposed for that family |

Example minimal skeleton:

```julia
Paramorph.param_space(::Type{<:MyCopula}, d) = Paramorph.Pos(:θ)
_available_fitting_methods(::Type{<:MyCopula}, d) = (:mle,) # in-package only

# No custom MLE is required: the generic route maps an unconstrained optimizer
# vector through `Paramorph.constrain` and calls `MyCopula(d, θ)`.
```

A custom `_fit(::Type{MyCopula}, U, ::Val{:mle}; ...)` remains appropriate when
the feasible set is not represented by the available parameter spaces or when
the family has a materially better dedicated objective.

Each fitting method is dispatched on `Val{:method}` for performance and clarity.''',
          )

          subblock(
              guide,
              r'''Remark that we could also opt-in the default moment matching methods, but for that we need to specify parameter relaxations through the following:.*?And we need to change our availiable methods:''',
              '''The `Paramorph.Bounded(:θ, -1.0, 1.0)` declaration above already
describes the optimizer relaxation; no legacy parameter-transform hooks are
needed. If the corresponding rank-inversion identities are implemented, the
family can register those methods alongside its custom estimator:
''',
          )
          replaceb(guide, 'availiable methods', 'available methods') if b'availiable methods' in Path(guide).read_bytes() else None

          # SklarDist params are `(copula, margins)`.
          for path in (
              'docs/src/manual/conditioning_and_subsetting.md',
              'docs/src/examples/ifm1.md',
              'docs/src/examples/lossalae.md',
              'docs/src/examples/expectation_maximization.md',
              'docs/src/examples/fitting_sklar.md',
              'docs/src/bestiary/nested.md',
              'docs/src/bestiary/empirical.md',
          ):
              p = Path(path)
              raw = p.read_bytes()
              raw = re.sub(rb'params\((\w+)\)\.copula', rb'first(params(\1))', raw)
              raw = re.sub(rb'params\((\w+)\)\.margins', rb'last(params(\1))', raw)
              p.write_bytes(raw)

          replaceb(
              'docs/src/examples/ifm1.md',
              'params(ifm2_cop).Σ .- params(first(params(quick_fit))).Σ',
              'only(params(ifm2_cop)) .- only(params(first(params(quick_fit))))',
          )
          replaceb(
              'docs/src/bestiary/liouville.md',
              '(parameters=params(C13).α, sample=rand(rng, C13))',
              '(parameters=last(params(C13)), sample=rand(rng, C13))',
          )
          replaceb(
              'docs/src/bestiary/elliptical.md',
              '(df=params(Ĉ).ν, correlation=params(Ĉ).Σ[1, 2])',
              '(df=first(params(Ĉ)), correlation=last(params(Ĉ))[1, 2])',
              count=2,
          )

          # Final documentation audit. Named access to a simple params(variable)
          # result is the old Distribution contract.
          failures = []
          for path in Path('docs').rglob('*.md'):
              text = path.read_text()
              for token in ('_unbound_params', '_rebound_params', '_construct_fitted_copula'):
                  if token in text:
                      failures.append(f'{token}: {path}')
              for lineno, line in enumerate(text.splitlines(), 1):
                  if re.search(r'\bparams\([A-Za-z_Ĉ][A-Za-z0-9_Ĉ]*\)\.[A-Za-z_α-ωΑ-ΩΣνθρ]', line):
                      failures.append(f'named params access: {path}:{lineno}:{line.strip()}')
          if failures:
              raise RuntimeError('stale docs contracts remain:\n' + '\n'.join(failures))
          PY

          git diff --check -- src test docs
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Paramorph migration cleanup'
          git push origin HEAD:parameter-spaces-fitting
