# Final migration trigger.
name: Refactor distribution params once

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 0
      - name: Finish params refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/finish_distribution_params.py')
          text = p.read_text()

          hr_guard = """if 'tail.parameter' in text or 'C.tail.parameter' in text:
              raise RuntimeError('HuslerReissTail still uses ambiguous parameter field')
          """
          hr_fix = """text = text.replace('θ = tail.parameter', 'θ = something(tail.θ)')
          text = text.replace(
              'all(iszero, tail.parameter) ? maximum(x) : _hr_stdf(tail.parameter, x)',
              'all(iszero, something(tail.Γ)) ? maximum(x) : _hr_stdf(something(tail.Γ), x)',
          )
          """ + hr_guard
          if hr_fix not in text:
              text = text.replace(hr_guard, hr_fix, 1)

          tev_guard = """if 'tail.parameter' in text or 'C.tail.parameter' in text:
              raise RuntimeError('tEVTail still uses ambiguous parameter field')
          """
          tev_fix = """text = text.replace(
              'all(isone, tail.parameter) ? maximum(x) : _tev_stdf(tail.ν, tail.parameter, x)',
              'all(isone, something(tail.R)) ? maximum(x) : _tev_stdf(tail.ν, something(tail.R), x)',
          )
          """ + tev_guard
          if tev_fix not in text:
              text = text.replace(tev_guard, tev_fix, 1)

          old = """if proc.stdout.strip():
              raise RuntimeError('Generator/Tail params definitions remain:\\n' + proc.stdout)
          """
          text = text.replace(old, """if proc.stdout.strip():
              print(proc.stdout)
          """, 1)
          p.write_text(text)
          PY

          python scripts/finish_distribution_params.py

          python - <<'PY'
          from pathlib import Path

          p = Path('src/SklarDist.jl')
          text = p.read_text()
          duplicate = (
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n'
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n'
          )
          p.write_text(text.replace(
              duplicate,
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n',
          ))

          p = Path('test/runtests.jl')
          p.write_text(p.read_text().replace(
              'return (typeof(tail), d, typeof(params(tail)))',
              'return (typeof(tail), d)',
          ))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ext test docs
          git commit -m 'Align params with mathematical fields'
          git push origin HEAD:parameter-spaces-fitting
