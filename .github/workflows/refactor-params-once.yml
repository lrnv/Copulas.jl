# Final migration trigger.
name: Refactor distribution params once

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 0
      - name: Finish params refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/Tail/HuslerReissTail.jl')
          p.write_text(p.read_text().replace(
              'θ = tail.parameter',
              'θ = something(tail.θ)',
          ))

          p = Path('src/Tail/tEVTail.jl')
          p.write_text(p.read_text().replace(
              'all(isone, tail.parameter) ? maximum(x) : _tev_stdf(tail.ν, tail.parameter, x)',
              'all(isone, something(tail.R)) ? maximum(x) : _tev_stdf(tail.ν, something(tail.R), x)',
          ))
          PY

          python scripts/finish_distribution_params.py

          python - <<'PY'
          from pathlib import Path

          p = Path('src/SklarDist.jl')
          text = p.read_text()
          duplicate = (
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n'
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n'
          )
          p.write_text(text.replace(
              duplicate,
              '_parameter_dof(x::Tuple) = sum(_parameter_dof, x; init=0)\n',
          ))

          p = Path('test/runtests.jl')
          p.write_text(p.read_text().replace(
              'return (typeof(tail), d, typeof(params(tail)))',
              'return (typeof(tail), d)',
          ))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src ext test docs
          git commit -m 'Align params with mathematical fields'
          git push origin HEAD:parameter-spaces-fitting
