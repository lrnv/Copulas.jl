name: Julia vs R benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark workload
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

concurrency:
  group: cross-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Julia vs R (${{ inputs.mode || 'full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CROSS_BENCH_MODE: ${{ inputs.mode || 'full' }}
      CROSS_BENCH_ROUNDS: ${{ inputs.mode == 'smoke' && '1' || '3' }}
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia environment
        run: julia --startup-file=no --project=benchmark/cross_language/julia -e 'using Pkg; Pkg.instantiate()'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install R system requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgsl-dev
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: benchmark/cross_language/r

      - name: Run interleaved Julia and R benchmarks
        run: bash benchmark/cross_language/scripts/run_suite.sh

      - name: Add comparison to job summary
        if: always() && hashFiles('benchmark/cross_language/results/comparison.md') != ''
        run: cat benchmark/cross_language/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw and rendered results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-vs-r-${{ env.CROSS_BENCH_MODE }}
          path: |
            benchmark/cross_language/results/raw/
            benchmark/cross_language/results/comparison.json
            benchmark/cross_language/results/comparison.md
          if-no-files-found: error
          retention-days: 90
