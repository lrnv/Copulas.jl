name: Fix parameter eltype loading

on:
  push:
    branches:
      - parameter-spaces-fitting

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: parameter-spaces-fitting
          fetch-depth: 1
      - name: Move late-type specializations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/utils.jl')
          text = p.read_text()
          old = '_parameter_eltype(x::Generator) = _parameter_eltype(fieldvalues(x))\n_parameter_eltype(x::Tail) = _parameter_eltype(fieldvalues(x))\n'
          if old not in text:
              raise RuntimeError('Generator/Tail parameter-eltype methods not found in utils.jl')
          p.write_text(text.replace(old, '', 1))

          p = Path('src/Generator.jl')
          text = p.read_text()
          old = 'abstract type Generator end\nBase.eltype(G::Generator) = _sample_eltype(G)\n'
          new = 'abstract type Generator end\n_parameter_eltype(G::Generator) = _parameter_eltype(fieldvalues(G))\nBase.eltype(G::Generator) = _sample_eltype(G)\n'
          if old not in text:
              raise RuntimeError('Generator insertion anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/Tail.jl')
          text = p.read_text()
          old = 'abstract type Tail end\nBase.eltype(tail::Tail) = _sample_eltype(tail)\n'
          new = 'abstract type Tail end\n_parameter_eltype(tail::Tail) = _parameter_eltype(fieldvalues(tail))\nBase.eltype(tail::Tail) = _sample_eltype(tail)\n'
          if old not in text:
              raise RuntimeError('Tail insertion anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils.jl src/Generator.jl src/Tail.jl
          git commit -m 'Fix parameter eltype load order'
          git push origin HEAD:parameter-spaces-fitting
