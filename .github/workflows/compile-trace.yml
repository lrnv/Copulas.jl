name: Full compile trace

on:
  push:
    branches:
      - perf/compile-trace
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/compile-trace.yml'

concurrency:
  group: compile-trace-${{ github.ref }}
  cancel-in-progress: true

strategy:
  matrix:
    optlevel: [0, 1]

jobs:
  trace:
    name: Julia 1.12 full compile trace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          arch: x64

      - uses: julia-actions/cache@v3

      - uses: julia-actions/julia-buildpkg@v1

      - name: Record environment
        shell: bash
        run: |
          julia --version | tee julia-version.txt
          git rev-parse HEAD | tee git-sha.txt

      - name: Run full test suite with compile trace
        shell: bash
        run: |
          set -o pipefail

          julia --project=. --startup-file=no -e '
            using Pkg

            tracefile = joinpath(
                ENV["GITHUB_WORKSPACE"],
                "compile-trace.txt",
            )

            Pkg.test(;
                coverage = false,
                julia_args = [
                    "--optimize=$(ENV["OPTLEVEL"])",
                    "--trace-compile=$tracefile",
                    "--trace-compile-timing",
                ],
            )
          ' 2>&1 | tee compile-trace-test.log

      - name: Upload compile trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-compile-trace-julia-1.12
          path: |
            compile-trace.txt
            compile-trace-test.log
            julia-version.txt
            git-sha.txt
          retention-days: 14