name: Apply Paramorph variant geometry cleanup

on:
  push:
    branches:
      - paramorph-0.0.3-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paramorph-0.0.3-migration
      - name: Apply variant cleanup
        run: python dev/finalize_paramorph_variants.py
      - name: Commit variant cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/paramorph-003-migration.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Declare representation-specific parameter geometries"
            git push origin HEAD:paramorph-0.0.3-migration
          fi
