name: Temporary Paramorph space colocation cleanup

on:
  push:
    branches:
      - parameter-spaces-fitting
    paths:
      - .github/workflows/tmp-colocate-paramorph-spaces.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Colocate spaces and simplify nested coordinates
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(path, marker, addition):
              p = Path(path)
              s = p.read_text()
              assert marker in s, (path, marker)
              assert addition.strip() not in s
              p.write_text(s.replace(marker, marker + addition, 1))

          p = Path('src/ParameterCoefficients.jl')
          s = p.read_text()
          start = s.index('function Paramorph.param_space(S::SklarDist)')
          end = s.index('@inline function _parameter_prefix', start)
          s = s[:start] + s[end:]
          s = s.replace(
              '    D isa NestedArchimedeanCopula && return length(last(_nested_coef(D)))\n',
              '', 1)
          p.write_text(s)

          insert_after(
              'src/SklarDist.jl',
              'Distributions.params(S::SklarDist) = (S.C, S.m)\n',
              '''function Paramorph.param_space(S::SklarDist)\n    copula_space = Paramorph.Prefixed(:copula, Paramorph.param_space(S.C))\n    margin_spaces = ntuple(length(S.m)) do i\n        Paramorph.Prefixed(Symbol("margin_", i), Paramorph.param_space(S.m[i]))\n    end\n    return (copula_space, margin_spaces...)\nend\n''')

          insert_after(
              'src/MiscellaneousCopulas/SurvivalCopula.jl',
              'Base.eltype(C::AbstractReflectedCopula) = eltype(basecopula(C))\n',
              '''Paramorph.param_space(C::AbstractReflectedCopula) =\n    Paramorph.param_space(basecopula(C))\n''')

          for path, marker, addition in (
              ('src/MiscellaneousCopulas/EmpiricalCopula.jl',
               'Distributions.params(C::EmpiricalCopula) = (C.u,)\n',
               'Paramorph.param_space(::Type{<:EmpiricalCopula}, ::Integer) = ()\n'),
              ('src/MiscellaneousCopulas/BetaCopula.jl',
               'Distributions.params(C::BetaCopula) = (C.ranks,)\n',
               'Paramorph.param_space(::Type{<:BetaCopula}, ::Integer) = ()\n'),
              ('src/MiscellaneousCopulas/BernsteinCopula.jl',
               'Distributions.params(C::BernsteinCopula) = (C.m, C.weights)\n',
               'Paramorph.param_space(::Type{<:BernsteinCopula}, ::Integer) = ()\n'),
              ('src/MiscellaneousCopulas/CheckerboardCopula.jl',
               'Distributions.params(C::CheckerboardCopula) = (C.m, C.boxes)\n',
               'Paramorph.param_space(::Type{<:CheckerboardCopula}, ::Integer) = ()\n'),
              ('src/Tail/EmpiricalEVTail.jl',
               'Base.eltype(::EmpiricalEVTail) = Float64\n',
               'Paramorph.param_space(::Type{<:EmpiricalEVTail}, ::Integer) = ()\n'),
              ('src/Tail/EmpiricalEVTail.jl',
               'Base.eltype(::EmpiricalEVMultivariateTail) = Float64\n',
               'Paramorph.param_space(::Type{<:EmpiricalEVMultivariateTail}, ::Integer) = ()\n'),
          ):
              insert_after(path, marker, addition)

          p = Path('src/NestedArchimedeanCopula.jl')
          s = p.read_text()
          start = s.index('# Bare UnionAll generator type from an instance')
          end = s.index('# ---- Fitting-interface opt-out', start)
          block = r'''# Bare UnionAll generator type from an instance, e.g. ClaytonGenerator{Float64}
# -> ClaytonGenerator.
_gentype(G::Generator) = typeof(G).name.wrapper

# Local arity controls the family-specific generator domain. It is the number
# of direct inverse-generator terms at a node (or the block size for a flat child).
_local_arity(C::NestedArchimedeanCopula) =
    max(length(C.leafdims) + length(C.children), 2)

_generator_space(G::Generator, dloc) =
    Paramorph.param_space(_gentype(G), dloc)

function _generator_parameter_values(G::Generator, dloc)
    p = _generator_space(G, dloc)
    return map(Paramorph.names(p)) do name
        value = getproperty(G, name)
        value isa AbstractArray ? copy(value) : value
    end
end

function _push_nested_spaces!(spaces, C::NestedArchimedeanCopula, tag::String)
    push!(spaces, Paramorph.Prefixed(Symbol(tag),
        _generator_space(C.G, _local_arity(C))))
    for (i, ch) in enumerate(C.children)
        childtag = "$(tag)[$i]"
        if ch isa Tuple
            cc, ds = ch
            push!(spaces, Paramorph.Prefixed(Symbol(childtag),
                _generator_space(cc.G, max(length(ds), 2))))
        else
            _push_nested_spaces!(spaces, ch, childtag)
        end
    end
    return spaces
end

function Paramorph.param_space(C::NestedArchimedeanCopula)
    spaces = Paramorph.AbstractParameterSpace[]
    _push_nested_spaces!(spaces, C, "G")
    return Tuple(spaces)
end

function _push_nested_parameter_values!(values, C::NestedArchimedeanCopula)
    append!(values, _generator_parameter_values(C.G, _local_arity(C)))
    for ch in C.children
        if ch isa Tuple
            cc, ds = ch
            append!(values, _generator_parameter_values(cc.G, max(length(ds), 2)))
        else
            _push_nested_parameter_values!(values, ch)
        end
    end
    return values
end

function _nested_parameter_values(C::NestedArchimedeanCopula)
    values = Any[]
    _push_nested_parameter_values!(values, C)
    return Tuple(values)
end

function _generator_from_values(G::Generator, dloc, values, i::Ref{Int})
    p = _generator_space(G, dloc)
    n = length(Paramorph.names(p))
    args = ntuple(k -> values[i[] + k - 1], n)
    i[] += n
    return _gentype(G)(args...)
end

function _rebuild_node_from_values(C::NestedArchimedeanCopula, values, i::Ref{Int})
    newG = _generator_from_values(C.G, _local_arity(C), values, i)
    newkids = Any[]
    for ch in C.children
        if ch isa Tuple
            cc, ds = ch
            ng = _generator_from_values(cc.G, max(length(ds), 2), values, i)
            push!(newkids, (ArchimedeanCopula(length(ds), ng), ds))
        else
            push!(newkids, _rebuild_node_from_values(ch, values, i))
        end
    end
    return NestedArchimedeanCopula{length(C.dims),typeof(newG)}(
        newG, copy(C.leafdims), newkids, copy(C.dims))
end

function _nested_from_coordinates(C::NestedArchimedeanCopula, p, α::AbstractVector)
    values = Paramorph.constrain(p, α)
    i = Ref(1)
    rebuilt = _rebuild_node_from_values(C, values, i)
    i[] == length(values) + 1 || error("nested parameter-space traversal mismatch")
    return rebuilt
end

# Compatibility helpers for the existing template-fitting and validation hooks.
# They no longer implement a coordinate system themselves: both delegate the
# complete coordinate map to the tree's Paramorph product space.
function _nested_unbound(C::NestedArchimedeanCopula)
    p = Paramorph.param_space(C)
    return Paramorph.unconstrain(p, _nested_parameter_values(C))
end

function _nested_rebound(C::NestedArchimedeanCopula, α::AbstractVector)
    p = Paramorph.param_space(C)
    return _nested_from_coordinates(C, p, α)
end

'''
          p.write_text(s[:start] + block + s[end:])

          pc = Path('src/ParameterCoefficients.jl').read_text()
          assert 'function Paramorph.param_space' not in pc
          assert 'Paramorph.param_space(::Type' not in pc
          assert 'Paramorph.param_space(S::AbstractReflectedCopula)' not in pc
          PY
          git diff --check
      - name: Verify nested product geometry
        run: |
          julia --project --startup-file=no -e '
            using Pkg; Pkg.instantiate()
            using Copulas, Distributions, StatsBase, Random
            C0 = NestedArchimedeanCopula(Copulas.ClaytonGenerator(1.0);
                children=[ClaytonCopula{2}(2.0), ClaytonCopula{2}(3.0)])
            p = Copulas.Paramorph.param_space(C0)
            @assert Copulas.Paramorph.dimension(p) == 3
            vals = Copulas._nested_parameter_values(C0)
            α = Copulas.Paramorph.unconstrain(p, vals)
            C1 = Copulas._nested_from_coordinates(C0, p, α)
            @assert Copulas._nested_coef(C1)[2] == Copulas._nested_coef(C0)[2]
            @assert Copulas._nested_tree_certified(C1)
            @assert Copulas._nested_rebound(C0, Copulas._nested_unbound(C0)) isa NestedArchimedeanCopula
            E = EmpiricalCopula([0.2 0.8; 0.3 0.7])
            @assert Copulas.Paramorph.dimension(Copulas.Paramorph.param_space(E)) == 0
            S = SklarDist(ClaytonCopula(2, 1.0), (Normal(), Exponential()))
            @assert Copulas.Paramorph.dimension(Copulas.Paramorph.param_space(S)) == 4
          '
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-colocate-paramorph-spaces.yml
          git add src
          git diff --check
          git commit -m "Colocate Paramorph spaces and simplify nested geometry"
          git push
