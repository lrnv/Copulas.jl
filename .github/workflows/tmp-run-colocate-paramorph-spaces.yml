name: Temporary run Paramorph colocation cleanup

on:
  push:
    branches: [parameter-spaces-fitting]
    paths: [.github/workflows/tmp-run-colocate-paramorph-spaces.yml]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Apply stored source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          text = Path('.github/workflows/tmp-colocate-paramorph-spaces.yml').read_text()
          m = re.search(r"b64decode\('([^']+)'\)", text)
          assert m, 'stored patch not found'
          exec(base64.b64decode(m.group(1)))
          PY
          git diff --check
      - name: Verify nested product geometry
        run: |
          julia --project --startup-file=no -e '
            using Pkg; Pkg.instantiate()
            using Copulas, Distributions, StatsBase
            C0 = NestedArchimedeanCopula(Copulas.ClaytonGenerator(1.0); children=[ClaytonCopula{2}(2.0), ClaytonCopula{2}(3.0)])
            p = Copulas.Paramorph.param_space(C0)
            @assert Copulas.Paramorph.dimension(p) == 3
            vals = Copulas._nested_parameter_values(C0)
            α = Copulas.Paramorph.unconstrain(p, vals)
            C1 = Copulas._nested_from_coordinates(C0, p, α)
            @assert isapprox(Copulas._nested_coef(C1)[2], Copulas._nested_coef(C0)[2]; rtol=1e-12, atol=1e-12)
            @assert Copulas._nested_tree_certified(C1)
            @assert Copulas._nested_rebound(C0, Copulas._nested_unbound(C0)) isa NestedArchimedeanCopula
            E = EmpiricalCopula([0.2 0.8; 0.3 0.7])
            @assert Copulas.Paramorph.dimension(Copulas.Paramorph.param_space(E)) == 0
            S = SklarDist(ClaytonCopula(2, 1.0), (Normal(), Exponential()))
            @assert Copulas.Paramorph.dimension(Copulas.Paramorph.param_space(S)) == 4
          '
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "Colocate Paramorph spaces and simplify nested geometry"
          git push
